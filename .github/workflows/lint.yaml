name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  addon-lint:
    name: App-Linter
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./brother_scan"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Run ShellCheck
        run: |
          shellcheck -x \
            brother_scan/rootfs/etc/cont-init.d/*.sh \
            brother_scan/rootfs/etc/services.d/brscan-skey/run \
            brother_scan/rootfs/etc/services.d/brscan-skey/finish \
            brother_scan/rootfs/usr/local/bin/brother-scan
